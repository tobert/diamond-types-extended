[package]
name = "diamond-types-extended"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
authors = ["Joseph Gentle <me@josephg.com>", "Amy Tobey <tobert@gmail.com>"]
exclude = [
    ".idea",
    "test_data",
    ".github"
]
license = "ISC"
description = "Unified CRDT library with ergonomic API - fork of diamond-types"
repository = "https://github.com/tobert/diamond-types-extended"
homepage = "https://github.com/tobert/diamond-types-extended"
documentation = "https://docs.rs/diamond-types-extended"
keywords = ["crdt", "collaborative", "sync", "distributed", "realtime"]
categories = ["data-structures", "concurrency"]

[workspace]
members = ["crates/crdt-testdata", "crates/trace-alloc"]

[dependencies]
smartstring = { version = "1.0.1", features = ["serde"] }
str_indices = "0.4.4"
smallvec = { version = "2.0.0-alpha.12", features = ["serde"] }
lazy_static = "1.5.0"

serde = { version = "1.0.228", features = ["derive"] }

serde_json = "1.0.149"

bumpalo = { version = "3.19.1", features = ["collections"] }

#jumprope = { path = "../../../jumprope-rs" }

# Its tempting to disable default-features in jumprope because it means we don't need to hook in crypto random, which
# saves some size in the wasm output size. But I think its better to default to having this feature enabled.
#jumprope = { path = "../jumprope-rs", version = "1.1.0" }
jumprope = "1.1.2"
humansize = "2.1.3"
num_enum = "0.7.5"

# crc32c might be faster, but it adds 10kb to the wasm bundle size. crc only adds 1kb.
#crc32c = "0.6"
crc = "3.4.0"
lz4_flex = { version = "0.12.0", optional = true }

#bitvec = "1.0.1"

# Needed for macos F_BARRIERFSYNC.
libc = "0.2.181"

rand = { version = "0.10.0", optional = true }


[dev-dependencies]
rand = "0.10.0"
clap = { version = "4", features = ["derive"] }
crdt-testdata = { path = "crates/crdt-testdata" }
trace-alloc = { path = "crates/trace-alloc" }
criterion = "0.8"

[[bench]]
name = "sync_benchmark"
harness = false

# For OT fuzz data tests
#json_minimal = "0.1.3"

[features]
#default = ["lz4", "storage", "rand"] # rand is only used in testing code, but there's no way to specify that.
default = ["lz4", "storage"]
memusage = ["trace-alloc/memusage"]
lz4 = ["dep:lz4_flex"]
dot_export = []
wchar_conversion = ["jumprope/wchar_conversion"]
merge_conflict_checks = []
storage = []
expose_benchmarking = []
stats = []

# This is internal only for generating JSON testing data. To generate, run test suite with
# rm *_tests.json; cargo test --features gen_test_data causalgraph::parents::tools -- --test-threads 1
gen_test_data = ["rand"]

[lib]
bench = false

[profile.release]
#debug = true
lto = true
codegen-units = 1
#opt-level = "s"
panic = "abort"


# Use with cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = true
#opt-level = 0